[pytest]
testpaths = tests
# On Windows, scipy's HiGHS (MILP) raises and handles native exceptions inside
# its own worker threads when it is called off the main thread. Results are
# correct and the process keeps running, but pytest's faulthandler prints each
# one as "Windows fatal exception: access violation". uvicorn doesn't enable
# faulthandler, so this only affects test output.
addopts = -q -p no:faulthandler
filterwarnings =
    ignore::DeprecationWarning:httpx
    ignore::PendingDeprecationWarning:starlette
